<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>クリクラ瀬戸 おすすめ商品</title>
  <style>
    :root{--blue:#0786d7;--ink:#14212b;--line:#dfe7ed;--bg:#f4f8fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}header{background:linear-gradient(135deg,#0b9be7,#0568bd);color:#fff;padding:26px 20px 24px}header h1{font-size:21px;margin:0 0 7px}header p{margin:0;font-size:14px;opacity:.9}.wrap{max-width:640px;margin:auto;padding:16px 14px 120px}.note{font-size:13px;color:#60717c;margin:0 2px 14px}.product{background:#fff;border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:104px 1fr;gap:13px;padding:12px;margin:10px 0;box-shadow:0 2px 8px #18344a0a}.photo{width:104px;height:104px;background:#e9f1f5;border-radius:10px;object-fit:cover}.photo.empty{display:grid;place-items:center;color:#7c8b94;font-size:12px}.name{font-size:16px;font-weight:700;margin:2px 0 4px}.price{color:#0675bf;font-weight:700;margin-bottom:7px}.description{font-size:13px;line-height:1.55;color:#53636d;margin:0 0 10px}.qty{display:flex;align-items:center;gap:8px;font-size:13px}.qty input,.qty select{width:110px;padding:7px;border:1px solid #c6d4dc;border-radius:7px;font-size:16px;background:#fff}.bottom{position:fixed;left:0;right:0;bottom:0;padding:12px 14px;background:#fffffff0;backdrop-filter:blur(8px);border-top:1px solid var(--line)}button{width:min(640px,100%);display:block;margin:auto;background:var(--blue);border:0;border-radius:12px;padding:15px;color:#fff;font-size:16px;font-weight:700}.empty-state,.loading{background:#fff;border-radius:12px;padding:25px;text-align:center;color:#697a85}.help{font-size:12px;line-height:1.5;color:#71808a;text-align:center;margin:14px 8px}#error{display:none;color:#c14343}
  </style>
</head>
<body>
<header><h1>クリクラ瀬戸 おすすめ商品</h1><p>数量を入力して「注文内容を送る」を押してください</p></header>
<main class="wrap">
  <p class="note">ご注文内容はトークに送信されます。スタッフが確認後にご連絡します。</p>
  <div id="products" class="loading">商品を読み込んでいます…</div>
  <p id="error" class="help">商品を読み込めませんでした。時間をおいて再度お試しください。</p>
  <p class="help">※価格・商品・在庫表示は専用管理画面で変更できます。</p>
</main>
<div class="bottom"><button id="orderButton" type="button">注文内容を送る</button></div>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const CATALOG_API='https://raw.githubusercontent.com/innoshimaseika1950/cricla-seto-order/main/products.json';
const LIFF_ID='2011951125-2wVukDBj';
let products=[];
function yen(n){return '¥'+Number(n||0).toLocaleString('ja-JP')}
function render(){
 const box=document.querySelector('#products');
 if(!products.length){box.className='empty-state';box.textContent='現在ご注文いただける商品はありません。';return}
 box.className='';
 box.innerHTML=products.map((p,i)=>`<article class="product"><div>${p.imageUrl?'<img class="photo" src="'+escapeHtml(p.imageUrl)+'" alt="">':'<div class="photo empty">商品画像</div>'}</div><div><div class="name">${escapeHtml(p.name)}</div><div class="price">${yen(p.price)}（税込）</div><p class="description">${escapeHtml(p.description||'').replace(/\n/g,'<br>')}</p><label class="qty">数量 <select data-index="${i}"><option value="0">選択してください</option>${Array.from({length:10},(_,n)=>`<option value="${n+1}">${n+1}個</option>`).join('')}</select></label>${p.stockLabel?'<div class="description" style="margin-top:7px">'+escapeHtml(p.stockLabel)+'</div>':''}</div></article>`).join('');
}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadProducts(){
 try{
   const response=await fetch(CATALOG_API,{cache:'no-store'});
   if(!response.ok)throw new Error('catalog error');
   const data=await response.json();
   products=(Array.isArray(data.products)?data.products:[]).filter(p=>p&&p.published);
   render();
 }catch(error){
   document.querySelector('#products').style.display='none';
   document.querySelector('#error').style.display='block';
 }
}
async function sendOrder(){
 const rows=[...document.querySelectorAll('input[data-index]')].map(el=>({p:products[el.dataset.index],q:Number(el.value||0)})).filter(x=>x.q>0);
 if(!rows.length){alert('ご注文する商品の数量を1個以上入力してください。');return}
 const total=rows.reduce((sum,x)=>sum+x.p.price*x.q,0);
 const text='【おすすめ商品 ご注文】\\n'+rows.map(x=>`・${x.p.name} × ${x.q}個　${yen(x.p.price*x.q)}`).join('\\n')+'\\n\\n合計：'+yen(total)+'\\n\\n※次回、ボトルご注文時にお届けいたします。';
 if(window.liff&&LIFF_ID){try{await liff.init({liffId:LIFF_ID});if(!liff.isInClient()){await navigator.clipboard.writeText(text);alert('注文内容をコピーしました。LINEのトークに貼り付けて送信してください。');return}await liff.sendMessages([{type:'text',text}]);liff.closeWindow()}catch(e){alert('送信準備中にエラーがありました。')};return}
 try{await navigator.clipboard.writeText(text);alert('LINE連携の設定前のため、注文内容をコピーしました。LINEトークに貼り付けて送信してください。')}catch(e){alert(text)}
}
document.querySelector('#orderButton').addEventListener('click',sendOrder);loadProducts();
</script>
</body>
</html>
