<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>クリクラ瀬戸｜商品管理</title>
<style>
:root{--blue:#0878c1;--ink:#153047;--line:#d7e2e8;--bg:#f3f7f9;--danger:#b53636}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:var(--ink)}header{background:linear-gradient(135deg,#0d92dc,#075da9);color:#fff;padding:25px 18px}h1{font-size:21px;margin:0 0 6px}header p{margin:0;font-size:13px;opacity:.9}.wrap{max-width:960px;margin:auto;padding:18px}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}.panel h2{font-size:17px;margin:0 0 8px}.hint{font-size:13px;line-height:1.55;color:#657684}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px;margin:10px 0;font-size:13px;font-weight:700}input,textarea,select{font:inherit;font-weight:400;border:1px solid #bcd0da;border-radius:8px;padding:10px;width:100%;background:#fff}textarea{min-height:90px}button{font:inherit;font-weight:700;border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:#fff;cursor:pointer}.secondary{background:#fff;color:var(--ink);border:1px solid #bcd0da}.danger{background:#fff;color:var(--danger);border:1px solid #e4bbbb}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hidden{display:none}.status{font-size:13px;margin-top:9px}.ok{color:#187343}.error{color:#b33232}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.card{margin:0;padding:0;overflow:hidden}.photo{height:120px;background:#e8f0f4 center/cover no-repeat}.content{padding:13px}.badge{font-size:12px;border-radius:999px;padding:3px 7px;background:#78858e;color:#fff}.badge.on{background:#16804d}.name{font-weight:800;font-size:16px;margin:9px 0 4px}.price{color:#0872b8;font-weight:800}.meta{font-size:12px;color:#63747f;margin-top:7px}.foot{font-size:12px;color:#62727c;margin-top:15px}code{word-break:break-all}@media(max-width:560px){.row{grid-template-columns:1fr}.wrap{padding:12px}.panel{padding:14px}}
</style>
</head>
<body>
<header><h1>副商材 商品管理</h1><p>商品追加・編集・公開切替・並び順の変更</p></header>
<main class="wrap">
<section id="loginPanel" class="panel">
<h2>管理画面に接続</h2>
<p class="hint">この画面はGitHubの権限を使って商品データを保存します。アクセストークンはこのブラウザを閉じると消去され、サーバーには保存されません。</p>
<label class="field">GitHub Fine-grained Personal Access Token<input id="token" type="password" autocomplete="off" placeholder="github_pat_..."></label>
<div class="actions"><button id="connect">接続する</button></div>
<p id="loginStatus" class="status"></p>
</section>
<section id="app" class="hidden">
<div class="panel">
<div class="actions" style="justify-content:space-between"><h2 id="formTitle">商品を追加</h2><button id="logout" class="secondary">接続を解除</button></div>
<input id="id" type="hidden">
<div class="row"><label class="field">商品名<input id="name" required placeholder="例：クリクラ天然水 12L"></label><label class="field">価格（税込）<input id="price" type="number" min="0" step="1" placeholder="0"></label></div>
<div class="row"><label class="field">表示順（小さい順）<input id="sortOrder" type="number" value="999"></label><label class="field">公開状態<select id="published"><option value="true">公開する</option><option value="false">非公開にする</option></select></label></div>
<label class="field">商品説明<textarea id="description" placeholder="特徴・内容量など"></textarea></label>
<div class="row"><label class="field">商品写真URL<input id="imageUrl" type="url" placeholder="https://..."></label><label class="field">在庫表示<select id="stockLabel"><option value="">表示なし</option><option>在庫あり</option><option>残りわずか</option><option>売り切れ</option></select></label></div>
<div class="actions"><button id="save">保存する</button><button id="clear" class="secondary">新規入力に戻す</button></div><p id="saveStatus" class="status"></p>
</div>
<section><h2>登録商品</h2><div id="list" class="grid"></div></section>
<p class="foot">保存すると注文ページへ自動反映されます（数十秒かかる場合があります）。</p>
</section>
</main>
<script>
const OWNER='innoshimaseika', REPO='crecla-seto-LINE-order', PATH='products.json';
let token=sessionStorage.getItem('creclaAdminToken')||'', sha='', products=[];
const $=id=>document.getElementById(id);
function api(path,options={}){return fetch('https://api.github.com'+path,{...options,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28',...(options.headers||{})}})}
function b64(s){const bytes=new TextEncoder().encode(s);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin)}
function fromB64(s){const bin=atob(s.replace(/\n/g,''));return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))}
function setStatus(id,text,type=''){const e=$(id);e.textContent=text;e.className='status '+type}
async function connect(){
 token=$('token').value.trim(); if(!token)return setStatus('loginStatus','トークンを入力してください。','error');
 setStatus('loginStatus','接続を確認しています…');
 try{const r=await api('/repos/'+OWNER+'/'+REPO+'/contents/'+PATH);if(!r.ok)throw new Error('権限またはトークンを確認してください。');const d=await r.json();sha=d.sha;const data=JSON.parse(fromB64(d.content));products=Array.isArray(data.products)?data.products:[];sessionStorage.setItem('creclaAdminToken',token);$('loginPanel').classList.add('hidden');$('app').classList.remove('hidden');render()}catch(e){setStatus('loginStatus',e.message,'error')}}
function resetForm(){$('id').value='';$('name').value='';$('price').value='';$('sortOrder').value='999';$('description').value='';$('imageUrl').value='';$('published').value='true';$('stockLabel').value='';$('formTitle').textContent='商品を追加';setStatus('saveStatus','')}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const list=$('list');const rows=[...products].sort((a,b)=>Number(a.sortOrder||999)-Number(b.sortOrder||999));if(!rows.length){list.innerHTML='<div class="panel">まだ商品がありません。</div>';return}list.innerHTML=rows.map(p=>'<article class="card"><div class="photo" style="background-image:url(&quot;'+esc(p.imageUrl)+'&quot;)"></div><div class="content"><span class="badge '+(p.published?'on':'')+'">'+(p.published?'公開中':'非公開')+'</span><div class="name">'+esc(p.name)+'</div><div class="price">¥'+Number(p.price||0).toLocaleString('ja-JP')+'</div><div class="meta">表示順 '+Number(p.sortOrder||999)+(p.stockLabel?' ・ '+esc(p.stockLabel):'')+'</div><div class="actions"><button class="secondary" data-edit="'+esc(p.id)+'">編集</button><button class="danger" data-delete="'+esc(p.id)+'">削除</button></div></div></article>').join('')}
function edit(id){const p=products.find(x=>x.id===id);if(!p)return;$('id').value=p.id;$('name').value=p.name||'';$('price').value=p.price||0;$('sortOrder').value=p.sortOrder||999;$('description').value=p.description||'';$('imageUrl').value=p.imageUrl||'';$('published').value=String(!!p.published);$('stockLabel').value=p.stockLabel||'';$('formTitle').textContent='商品を編集';window.scrollTo({top:0,behavior:'smooth'})}
async function save(){const name=$('name').value.trim(),price=Number($('price').value);if(!name||!Number.isFinite(price)||price<0)return setStatus('saveStatus','商品名と0以上の価格を入力してください。','error');const item={id:$('id').value||crypto.randomUUID(),name,price,description:$('description').value.trim(),imageUrl:$('imageUrl').value.trim(),published:$('published').value==='true',sortOrder:Number($('sortOrder').value||999),stockLabel:$('stockLabel').value};const i=products.findIndex(p=>p.id===item.id);if(i>=0)products[i]=item;else products.push(item);await write()}
async function remove(id){const p=products.find(x=>x.id===id);if(!p||!confirm('「'+p.name+'」を削除しますか？'))return;products=products.filter(x=>x.id!==id);await write()}
async function write(){setStatus('saveStatus','保存中です…');try{const content=JSON.stringify({products},null,2)+'\n';const r=await api('/repos/'+OWNER+'/'+REPO+'/contents/'+PATH,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'商品データを管理画面から更新',content:b64(content),sha})});if(!r.ok)throw new Error('保存できませんでした。別の端末で更新した場合は再接続してください。');const d=await r.json();sha=d.content.sha;setStatus('saveStatus','保存しました。注文ページへ反映されます。','ok');resetForm();render()}catch(e){setStatus('saveStatus',e.message,'error')}}
$('connect').onclick=connect;$('token').addEventListener('keydown',e=>{if(e.key==='Enter')connect()});$('save').onclick=save;$('clear').onclick=resetForm;$('logout').onclick=()=>{sessionStorage.removeItem('creclaAdminToken');token='';location.reload()};$('list').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.edit)edit(b.dataset.edit);if(b.dataset.delete)remove(b.dataset.delete)};if(token){$('token').value=token;connect()}
</script>
</body></html>
